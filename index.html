<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mai Thị Thanh Thúy</title>
</head>

<style>
  /* ========== CẤU HÌNH CHUNG CỦA TOÀN BỘ DỰ ÁN ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(to right, #2c5364, #0f2027);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 120px 0 120px 0;
    /* 
           - Thuộc tính này chỉ tác động duy nhất lên chữ (Text/Font rendering), hoàn toàn không ảnh hưởng đến hình ảnh (img), 
            đường vẽ vector hay khung thẻ HTML.
           - Chỉ định cách làm mịn font trên trình duyệt WebKit (chủ yếu macOS/iOS).
           - antialiased sử dụng grayscale antialiasing giúp chữ trông mảnh và mượt hơn.
           - Không phải trình duyệt hay hệ điều hành nào cũng hỗ trợ thuộc tính này (Windows / Android hầu như bỏ qua thuộc tính này). 
        */
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --cube-size: 250px;
    --cube-half: calc(var(--cube-size) / 2);
  }

  /*Dự án 1: 3D Cube*/
  .container-cube {
    margin-top: 40px;
    /* 
            - Thuộc tính quan trọng nhất để kích hoạt 3D. Tạo phối cảnh cho các phần tử con sử dụng transform 3D
              Khoảng cách từ mắt người nhìn (Virtual Camera) đến mặt phẳng màn hình.
            - Nếu perspective càng nhỏ thì hiệu ứng phối cảnh càng mạnh. Các vật ở gần sẽ trông lớn hơn, các vật ở xa sẽ nhỏ đi nhanh hơn.
              VD: Với perspective: 300px; => Khối lập phương sẽ méo rất mạnh.
            - Nếu perspective lớn => Chiều sâu 3D vừa phải, tự nhiên và dễ nhìn, ít biến dạng hơn.
        */
    perspective: 1200px;
    /* Điểm tụ góc nhìn (Vanishing Point) đặt chính giữa tâm phần tử (50 ngang, 50 dọc) giúp hiệu ứng xoay đều về mọi hướng. */
    perspective-origin: 50% 50%;
    /* Bản tương thích cho các trình duyệt chạy nhân WebKit cũ. */
    -webkit-perspective: 1200px;
  }

  /* 
      Lớp wrapper chịu trách nhiệm duy nhất: xoay quanh trục Y.
      Cần preserve-3d để context 3D truyền xuống .cube bên trong.
  */
  .cube-wrapper {
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    animation: spin-y 17s linear infinite;
    will-change: transform;
  }

  .cube {
    position: relative;
    width: var(--cube-size);
    height: var(--cube-size);
    /* 
            - Các phần tử con không bị trình duyệt "ép phẳng" (flat) thành 2D, 
              giữ nguyên các phép biến đổi 3D của phần tử con khi render, thay vì trình duyệt gom (flatten) chúng về mặt phẳng của phần tử cha.
              Giúp các phần tử con có thể di chuyển trong không gian tọa độ 3D X, Y, Z. 
        */
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    /* 
        - Chỉ xoay trục X — độc lập hoàn toàn với trục Y của wrapper cha.
        - Tỉ lệ bất tương xứng (incommensurate) buộc quỹ đạo phủ đều
          toàn bộ không gian định hướng, đảm bảo cả 6 mặt đều xuất hiện.
    */
    animation: spin-x 22s linear infinite;
    /* 
         - Báo trước cho trình duyệt rằng thuộc tính transform sẽ thường xuyên thay đổi,
          giúp trình duyệt có thể chuẩn bị các tối ưu render nếu cần.
          Chỉ nên dùng khi phần tử thực sự được animate hoặc thay đổi liên tục.
        - Trình duyệt có thể tạo compositing layer hoặc áp dụng các tối ưu tăng tốc phần cứng,
          nhưng điều này không được đảm bảo và phụ thuộc từng browser.
        */
    will-change: transform;
  }

  .cube img {
    /* 
          - Xếp đè 6 tấm ảnh lên cùng vị trí ban đầu của khối .cube.
          - Đặt tất cả các mặt của khối lập phương tại cùng một vị trí gốc trước khi dùng transform để đưa chúng ra các mặt khác nhau.
        */
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
    border: 1px solid rgba(255, 255, 255, 0.15);
    /* Đổ bóng nhẹ xung quanh từng mặt ảnh, tăng tính chân thật 3D. */
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    /* 
          - Khóa mặt sau. 
          - Khi một mặt ảnh xoay lật lưng về phía mắt người xem, trình duyệt sẽ ẩn hoàn toàn mặt sau đó đi, tránh nhìn thấy mặt sau của ảnh trong không gian 3D.
        */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    /* 
            - Thủ thuật (workaround) giúp giảm một số lỗi hiển thị ở mép phần tử
              khi thực hiện transform 3D trên một số trình duyệt.
              Không phải lúc nào cũng cần và hiệu quả có thể khác nhau tùy browser.
        */
    outline: 1px solid transparent;
  }

  /*
      -  Lý do translateZ của 6 tấm ảnh đều là 125px vì cube có width và height đều là 250px => Lấy 250 / 2 là ra 125.
      -  Mỗi mặt của khối lập phương được đặt cách tâm khối một nửa chiều dài cạnh.
    */

  /* 
      - Mặt 1 (Phía trước - Front)
      - Giữ nguyên hướng nhìn 0deg, đẩy tấm ảnh ra phía trước mặt người xem 125px theo trục Z.
    */
  .cube img:nth-child(1) {
    transform: rotateY(0deg) translateZ(var(--cube-half));
  }

  /* 
      - Mặt 2 (Bên phải - Right)
      - Xoay ảnh sang phải 90deg quanh trục Y, sau đó đẩy ra phía trước của mặt đó 125px.
    */
  .cube img:nth-child(2) {
    transform: rotateY(90deg) translateZ(var(--cube-half));
  }

  /* 
      - Mặt 3 (Phía sau - Back)
      - Xoay ngược ra đằng sau 180deg quanh trục Y, rồi đẩy ra 125px.
    */
  .cube img:nth-child(3) {
    transform: rotateY(180deg) translateZ(var(--cube-half));
  }

  /* 
      - Mặt 4 (Bên trái - Left)
      - Xoay ảnh sang trái -90deg quanh trục Y, rồi đẩy ra 125px.
    */
  .cube img:nth-child(4) {
    transform: rotateY(-90deg) translateZ(var(--cube-half));
  }

  /*
      - Mặt 5 (Mặt trên - Top)
      - Ngửa ảnh lên trên 90deg quanh trục X, rồi đẩy lên trên 125px.
    */
  .cube img:nth-child(5) {
    transform: rotateX(90deg) translateZ(var(--cube-half));
  }

  /*
      - Mặt 6 (Mặt dưới - Bottom)
      - Úp ảnh xuống dưới -90deg quanh trục X, rồi đẩy xuống dưới 125px.
    */
  .cube img:nth-child(6) {
    transform: rotateX(-90deg) translateZ(var(--cube-half));
  }

  /* 
      - Mỗi keyframe chỉ điều khiển 1 trục — đây là điều kiện bắt buộc.
      - Nếu gộp cả 2 trục vào 1 keyframe với cùng tốc độ, trục xoay sẽ bị cố định
        tại góc 45° (vector (1,1,0)), khiến một số mặt gần như không bao giờ hiện.
  */
  @keyframes spin-y {
    to { 
      transform: rotateY(360deg); 
    }
  }

  @keyframes spin-x {
    to { 
      transform: rotateX(360deg); 
    }
  }

  @media screen and (max-width: 768px) {

    /* Tất cả các mặt và translateZ tự động cập nhật theo */
    :root {
      --cube-size: 180px;
    }
  }
</style>

<body>
  <div class="container-cube">
    <div class="cube-wrapper">
      <div class="cube">
        <img src="Thuy7.jpg" alt="">
        <img src="Thuy8.jpg" alt="">
        <img src="Thuy12.jpg" alt="">
        <img src="Thuy17.jpg" alt="">
        <img src="Thuy24.jpg" alt="">
        <img src="Thuy35.jpg" alt="">
      </div>
    </div>
  </div>
</body>

</html>
